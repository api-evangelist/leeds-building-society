- aid: leeds-building-society:obie-account-transaction-information-api
  name: OBIE Account and Transaction Information API (AIS, shared standard)
  description: >-
    The OBIE Read/Write Account and Transaction Information (AIS) standard for
    retrieving account, balance, transaction, and beneficiary data with customer
    consent, secured with FAPI-grade OAuth2/OIDC, mutual-TLS, and PSD2 strong
    customer authentication. Captured here as the shared OBIE standard reference;
    Leeds Building Society does not offer current accounts and does not publish
    this API. Unverified for this bank - no base URL was confirmed.
  humanURL: https://github.com/OpenBankingUK/read-write-api-specs
