- aid: leeds-building-society:obie-payment-initiation-api
  name: OBIE Payment Initiation API (PIS, shared standard)
  description: >-
    The OBIE Read/Write Payment Initiation (PIS) standard for initiating
    domestic, scheduled, standing-order, international, and file payments with
    customer consent, secured with FAPI OAuth2/OIDC, mutual-TLS, and PSD2 strong
    customer authentication. Captured here as the shared OBIE standard reference;
    Leeds Building Society is not a payment account provider and does not publish
    this API. Unverified for this bank - no base URL was confirmed.
  humanURL: https://github.com/OpenBankingUK/read-write-api-specs
