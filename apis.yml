name: Leeds Building Society
kind: company
description: >-
  Leeds Building Society is the fifth-largest building society in the United
  Kingdom, a mutual owned by and run for the benefit of its members rather than
  shareholders. Founded in 1875 and headquartered in Leeds, West Yorkshire, it
  holds over GBP 31 billion in assets and serves more than 991,000 members,
  focusing on savings and residential mortgages (including shared-ownership and
  later-life lending) rather than current accounts. It is authorised by the
  Prudential Regulation Authority and regulated by the Financial Conduct
  Authority and the PRA. Because Leeds Building Society does not provide payment
  or current accounts, it is not one of the CMA9 mandated banks and is not an
  Account Servicing Payment Service Provider (ASPSP) under PSD2 / UK Open
  Banking; it participates in Open Banking as a data consumer (for example using
  Experian Boost and Account Information data to speed mortgage affordability
  decisions) rather than as an API provider. As of this review it publishes no
  public developer portal, no OBIE Open Data endpoint, and no OBIE Read/Write
  APIs. The OBIE standard specifications below are captured as shared-standard
  references, not as Leeds Building Society API contracts.
