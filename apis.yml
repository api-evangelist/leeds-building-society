- aid: leeds-building-society:obie-open-data-api
  name: OBIE Open Data API (shared standard)
  description: >-
    The UK Open Banking (OBIE) Open Data API standard for public, unauthenticated
    reference data - ATM locations, branch locations, personal and business
    current accounts, unsecured SME loans, and commercial credit cards. This is
    the shared OBIE standard specification, NOT a Leeds Building Society API
    contract. Leeds Building Society is not a CMA9 ASPSP and does not currently
    publish an Open Data endpoint; no live base URL was confirmed for this bank.
  humanURL: https://openbankinguk.github.io/opendata-api-docs-pub/v2.4.0/
  tags:
